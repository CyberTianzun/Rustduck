[package]
name = "rustduck"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
futures = "0.3"
gpui = { version = "=0.3.11", package = "gpui-pre" }
gpui-component = "0.9.0"
gpui-kit = "0.9.0"
gpui-kit-assets = "0.9.0"
hex = "0.4"
hmac = "0.12"
keyring = "3"
percent-encoding = "2"
quick-xml = "0.37"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
russh = "0.50"
russh-sftp = "2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
smb = "0.12.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "net"] }
tokio-util = { version = "0.7", features = ["io"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = 0

[profile.test]
debug = 0
